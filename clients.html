<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advocate Portal - Clients</title>
    <script src="https://tailwindcss.com"></script>
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') { window.location.href = 'index.html'; }
    </script>
</head>
<body class="bg-slate-100 font-sans flex h-screen overflow-hidden">

    <!-- SIDEBAR NAVIGATION -->
    <div class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between hidden md:flex">
        <div>
            <div class="p-5 bg-slate-950 flex items-center space-x-3 text-white">
                <svg xmlns="http://w3.org" class="h-6 w-6 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3" />
                </svg>
                <span class="font-bold text-lg tracking-wide">Advocate Desk</span>
            </div>
            <nav class="mt-6 px-4 space-y-2">
                <a href="dashboard.html" class="flex items-center space-x-3 hover:bg-slate-800 px-4 py-3 rounded-lg font-medium transition"><span>📊 Dashboard</span></a>
                <a href="diary.html" class="flex items-center space-x-3 hover:bg-slate-800 px-4 py-3 rounded-lg font-medium transition"><span>📅 Daily Case Diary</span></a>
                <a href="clients.html" class="flex items-center space-x-3 bg-amber-600 text-white px-4 py-3 rounded-lg font-medium transition"><span>👥 Client Database</span></a>
                <a href="billing.html" class="flex items-center space-x-3 hover:bg-slate-800 px-4 py-3 rounded-lg font-medium transition"><span>💳 Fee & Accounts</span></a>
            </nav>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="flex-1 flex flex-col overflow-y-auto">
        <header class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center shadow-sm">
            <h2 class="text-xl font-bold text-slate-800">👥 Client Management Database</h2>
        </header>

        <main class="p-8 space-y-8">
            <!-- Add New Client Form -->
            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <h3 class="text-lg font-bold text-slate-800 mb-4">Register New Client</h3>
                <form id="clientForm" onsubmit="addClient(event)" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Full Name</label>
                        <input type="text" id="clientName" required placeholder="e.g., Muhammad Asif" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Phone Number</label>
                        <input type="text" id="clientPhone" required placeholder="e.g., 03001234567" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">CNIC / ID Number</label>
                        <input type="text" id="clientCNIC" required placeholder="e.g., 37101-XXXXXXX-X" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div class="flex items-end">
                        <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2 px-4 rounded-lg text-sm transition">
                            ➕ Register Client
                        </button>
                    </div>
                </form>
            </div>

            <!-- Client List Table -->
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-700 text-xs uppercase font-bold border-b">
                            <th class="p-4">Name</th>
                            <th class="p-4">Phone</th>
                            <th class="p-4">CNIC</th>
                            <th class="p-4">Case Status</th>
                        </tr>
                    </thead>
                    <tbody id="clientTableBody" class="text-sm text-slate-600 divide-y">
                        <tr>
                            <td class="p-4 font-semibold text-slate-800">Kamran Khan</td>
                            <td class="p-4">0321-5554321</td>
                            <td class="p-4">37101-1234567-1</td>
                            <td class="p-4"><span class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs font-bold">Active</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        function addClient(event) {
            event.preventDefault();
            const name = document.getElementById('clientName').value;
            const phone = document.getElementById('clientPhone').value;
            const cnic = document.getElementById('clientCNIC').value;
            const tableBody = document.getElementById('clientTableBody');

            const newRow = document.createElement('tr');
            newRow.className = "bg-white hover:bg-slate-50 transition";
            newRow.innerHTML = `
                <td class="p-4 font-semibold text-slate-800">${name}</td>
                <td class="p-4">${phone}</td>
                <td class="p-4">${cnic}</td>
                <td class="p-4"><span class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs font-bold">Active</span></td>
            `;
            tableBody.insertBefore(newRow, tableBody.firstChild);
            document.getElementById('clientForm').reset();
        }
    </script>
</body>
</html>
