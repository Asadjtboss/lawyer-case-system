<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advocate Portal - Billing</title>
    <script src="https://tailwindcss.com"></script>
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') { window.location.href = 'index.html'; }
    </script>
</head>
<body class="bg-slate-100 font-sans flex h-screen overflow-hidden">

    <!-- SIDEBAR NAVIGATION -->
    <div class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between hidden md:flex">
        <div>
            <div class="p-5 bg-slate-950 flex items-center space-x-3 text-white">
                <svg xmlns="http://w3.org" class="h-6 w-6 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3" />
                </svg>
                <span class="font-bold text-lg tracking-wide">Advocate Desk</span>
            </div>
            <nav class="mt-6 px-4 space-y-2">
                <a href="dashboard.html" class="flex items-center space-x-3 hover:bg-slate-800 px-4 py-3 rounded-lg font-medium transition"><span>📊 Dashboard</span></a>
                <a href="diary.html" class="flex items-center space-x-3 hover:bg-slate-800 px-4 py-3 rounded-lg font-medium transition"><span>📅 Daily Case Diary</span></a>
                <a href="clients.html" class="flex items-center space-x-3 hover:bg-slate-800 px-4 py-3 rounded-lg font-medium transition"><span>👥 Client Database</span></a>
                <a href="billing.html" class="flex items-center space-x-3 bg-amber-600 text-white px-4 py-3 rounded-lg font-medium transition"><span>💳 Fee & Accounts</span></a>
            </nav>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="flex-1 flex flex-col overflow-y-auto">
        <header class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center shadow-sm">
            <h2 class="text-xl font-bold text-slate-800">💳 Fee Ledger & Billing</h2>
        </header>

        <main class="p-8 space-y-8">
            <!-- Account Overview Table -->
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="p-5 border-b bg-slate-50 font-bold text-slate-800">Financial Ledger</div>
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-700 text-xs uppercase font-bold border-b">
                            <th class="p-4">Client / Case</th>
                            <th class="p-4">Total Fee</th>
                            <th class="p-4">Paid Amount</th>
                            <th class="p-4">Remaining Balance</th>
                        </tr>
                    </thead>
                    <tbody class="text-sm text-slate-600 divide-y">
                        <tr>
                            <td class="p-4 font-semibold text-slate-800">Kamran Khan (FESCO Case)</td>
                            <td class="p-4">Rs. 50,000</td>
                            <td class="p-4 text-green-600 font-medium">Rs. 30,000</td>
                            <td class="p-4 text-rose-600 font-bold">Rs. 20,000</td>
                        </tr>
                        <tr>
                            <td class="p-4 font-semibold text-slate-800">Zubair Ahmad (Property)</td>
                            <td class="p-4">Rs. 120,000</td>
                            <td class="p-4 text-green-600 font-medium">Rs. 120,000</td>
                            <td class="p-4 text-slate-500 font-bold">Rs. 0 (Clear)</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</body>
</html>
