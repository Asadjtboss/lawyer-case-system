<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advocate Portal - Login</title>
    <!-- Tailwind CSS CDN for modern UI -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-100 h-screen flex items-center justify-center font-sans">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-slate-200">
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div class="bg-amber-600 text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 shadow-md">
                <!-- Scale / Law Icon -->
                <svg xmlns="http://w3.org" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Advocate Legal Portal</h1>
            <p class="text-slate-500 text-sm mt-1">Sign in to manage diary and client data</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Username / Email</label>
                <input type="text" id="username" required placeholder="admin" 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none transition">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none transition">
            </div>

            <!-- Error Message Container -->
            <div id="errorMessage" class="text-red-600 text-sm hidden font-medium text-center bg-red-50 p-2 rounded border border-red-200">
                Invalid username or password!
            </div>

            <button type="submit" 
                class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 px-4 rounded-lg shadow transition duration-200">
                Sign In Securely
            </button>
        </form>
    </div>

    <!-- Login Auth Script -->
    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            // Default credentials (Aap inhein change kar sakte hain)
            const defaultUser = "admin";
            const defaultPass = "admin123";

            if (usernameInput === defaultUser && passwordInput === defaultPass) {
                errorDiv.classList.add('hidden');
                // Session store kar rahe hain taake aglay pages par access barkrar rahe
                localStorage.setItem('isLoggedIn', 'true');
                // Dashboard page par redirect
                window.location.href = 'dashboard.html';
            } else {
                errorDiv.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
