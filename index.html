<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advocate Portal - Login</title>
    <script src="https://tailwindcss.com"></script>
    <!-- Custom Style Sheet Link -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen flex items-center justify-center p-4">

    <div class="glass-card p-10 rounded-2xl w-full max-w-md border border-slate-100">
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div class="bg-gradient-to-tr from-amber-600 to-amber-700 text-white w-20 h-20 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-xl transform rotate-3 hover:rotate-0 transition duration-300">
                <!-- Scale / Law Icon -->
                <svg xmlns="http://w3.org" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3" />
                </svg>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Advocate Legal Portal</h1>
            <p class="text-slate-500 text-xs mt-1.5 uppercase tracking-wider font-semibold">Secure Practice Management</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-6">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">Username / Email</label>
                <input type="text" id="username" required placeholder="admin" 
                    class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none transition bg-slate-50/50">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">Password</label>
                <input type="password" id="password" required placeholder="••••••••" 
                    class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none transition bg-slate-50/50">
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="text-red-600 text-sm hidden font-semibold text-center bg-red-50 p-3 rounded-xl border border-red-200">
                ⚠️ Invalid username or password!
            </div>

            <button type="submit" 
                class="btn-primary w-full text-white font-bold py-3.5 px-4 rounded-xl transition duration-200 uppercase tracking-wider text-sm">
                Sign In Securely
            </button>
        </form>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            if (usernameInput === "admin" && passwordInput === "admin123") {
                errorDiv.classList.add('hidden');
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'dashboard.html';
            } else {
                errorDiv.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
