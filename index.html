<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advocate Portal - Login</title>
    <!-- Humari apni custom css style connection -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Sirf login page ke liye premium center alignment grid design */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-box {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-w: 400px;
            border: 1px solid #334155;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.05em;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        .input-group input:focus {
            border-color: #f59e0b;
        }
        .btn-submit {
            background: #a16207;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #b45309;
        }
        .error-msg {
            background: #881337;
            color: #fda4af;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
            border: 1px solid #9f1239;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <!-- Law Scale Icon Header -->
        <div style="margin-bottom: 25px;">
            <div style="background: #0f172a; width: 60px; height: 60px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto; border: 1px solid #334155;">
                <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke="#f59e0b" style="width: 32px; height: 32px;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3" />
                </svg>
            </div>
            <h2 style="color: #fff; font-size: 1.4rem; font-weight: 700;">Advocate Portal</h2>
            <p style="color: #64748b; font-size: 0.85rem; margin-top: 4px;">Sign in to secure legal workspace</p>
        </div>

        <!-- Form Security Control -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            
            <!-- Error Box -->
            <div id="errorMessage" class="error-msg">
                ⚠️ Invalid Username or Password!
            </div>

            <div class="input-group">
                <label>Username / Email</label>
                <input type="text" id="username" required placeholder="admin">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit">
                Sign In Securely
            </button>
        </form>
    </div>

    <!-- Auth Script Logic -->
    <script>
        function handleLogin(event) {
            event.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            // Hardcoded Credentials
            if (usernameInput === "admin" && passwordInput === "admin123") {
                errorDiv.style.display = 'none';
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'dashboard.html'; // Dashboard file par redirect
            } else {
                errorDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
