<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 📱 ZAROORI TAG: Yeh line mobile screen ko auto-detect kar ke layout fit karegi -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Advocate Portal - Dashboard</title>
    
    <style>
        @import url('https://googleapis.com');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
        }

        /* --- DESKTOP STRUCTURE --- */
        .sidebar {
            width: 260px;
            background: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px;
            background: #0f172a;
            font-weight: bold;
            color: #f59e0b;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            margin-top: 20px;
            padding: 0 15px;
        }

        .nav-links a {
            display: block;
            padding: 12px 15px;
            color: #cbd5e1;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .nav-links a.active, .nav-links a:hover {
            background: #a16207;
            color: #fff;
        }

        .btn-logout {
            background: #be123c;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            height: 100vh;
        }

        .top-navbar {
            background: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
        }

        .grid-container {
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .stat-title {
            color: #64748b;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0f172a;
            margin-top: 5px;
        }

        .stat-icon {
            font-size: 2rem;
            background: #fef3c7;
            padding: 10px;
            border-radius: 10px;
        }

        .action-panel {
            margin: 0 30px 30px 30px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .action-btn {
            display: block;
            text-align: center;
            padding: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            text-decoration: none;
            color: #334155;
            font-weight: 600;
            background: #f8fafc;
        }

        .action-btn:hover {
            border-color: #d97706;
            background: #fffbeb;
            color: #b45309;
        }

        /* --- 📱 EXCLUSIVE MOBILE OVERRIDES --- */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 2px solid #334155;
            }

            .nav-links {
                display: grid;
                grid-template-columns: 1fr 1fr; /* Mobile par buttons do rows mein set honge */
                gap: 8px;
                padding: 12px;
                margin-top: 0;
            }

            .nav-links a {
                margin-bottom: 0;
                padding: 10px;
                font-size: 0.85rem;
                text-align: center;
            }

            .btn-logout {
                border-radius: 0;
                padding: 12px;
            }

            .main-content {
                height: auto;
            }

            .top-navbar {
                padding: 15px;
                flex-direction: column;
                gap: 6px;
                text-align: center;
            }

            .grid-container {
                padding: 15px;
                grid-template-columns: 1fr 1fr; /* Mobile screen par do cards barabar dikhenge */
                gap: 12px;
            }

            .stat-card {
                padding: 15px;
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }

            .stat-value {
                font-size: 1.3rem;
            }

            .stat-icon {
                font-size: 1.5rem;
                padding: 6px;
            }

            .action-panel {
                margin: 15px;
                padding: 15px;
            }
        }
    </style>

    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') { window.location.href = 'index.html'; }
        function handleLogout() { localStorage.removeItem('isLoggedIn'); window.location.href = 'index.html'; }
    </script>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div>
            <div class="sidebar-header">
                <span>⚖️ Advocate Desk</span>
            </div>
            <nav class="nav-links">
                <a href="dashboard.html" class="active">📊 Dashboard</a>
                <a href="diary.html">📅 Diary</a>
                <a href="clients.html">👥 Clients</a>
                <a href="billing.html">💳 Billing</a>
            </nav>
        </div>
        <div>
            <button onclick="handleLogout()" class="btn-logout">🚪 Logout</button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <header class="top-navbar">
            <h2 style="font-weight: 700;">Welcome, Counselor</h2>
            <div style="font-size: 0.85rem; color: #64748b;">Role: <span style="color: #d97706; font-weight: 700;">Admin</span></div>
        </header>

        <!-- Stats Grid -->
        <div class="grid-container">
            <div class="stat-card">
                <div>
                    <div class="stat-title">Hearings</div>
                    <div class="stat-value">4</div>
                </div>
                <div class="stat-icon">📅</div>
            </div>
            <div class="stat-card">
                <div>
                    <div class="stat-title">Clients</div>
                    <div class="stat-value">42</div>
                </div>
                <div class="stat-icon">👥</div>
            </div>
            <div class="stat-card">
                <div>
                    <div class="stat-title">Cases</div>
                    <div class="stat-value">18</div>
                </div>
                <div class="stat-icon">💼</div>
            </div>
            <div class="stat-card">
                <div>
                    <div class="stat-title">Dues</div>
                    <div class="stat-value" style="color: #be123c;">85k</div>
                </div>
                <div class="stat-icon">💰</div>
            </div>
        </div>

        <!-- Quick Navigation -->
        <div class="action-panel">
            <h3 style="font-size: 1rem; font-weight: 700;">Quick Navigation Panel</h3>
            <div class="action-grid">
                <a href="diary.html" class="action-btn">📒 Open Diary</a>
                <a href="clients.html" class="action-btn">📝 Add Client</a>
                <a href="billing.html" class="action-btn">💳 View Fee</a>
            </div>
        </div>
    </div>

</body>
</html>
