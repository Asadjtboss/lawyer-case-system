<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advocate Portal - Daily Diary</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .content-box { padding: 30px; }
        .form-card { background: white; padding: 25px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #e2e8f0; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .input-field { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; outline: none; background: white; color: #1e293b; }
        .input-field:focus { border-color: #f59e0b; }
        .btn-add { background: #0f172a; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.9rem; width: 100%; height: 42px; }
        .btn-add:hover { background: #1e293b; }
        
        .table-card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; }
        .table-title { padding: 20px; font-weight: bold; background: #f8fafc; border-bottom: 1px solid #e2e8f0; color: #1e293b; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #1e293b; color: white; padding: 14px; font-size: 0.85rem; text-transform: uppercase; }
        td { padding: 14px; border-bottom: 1px solid #e2e8f0; font-size: 0.9rem; color: #334155; }
        tr:hover { background: #fffbeb; }
        
        /* Status Badges Colors styling using simple classes */
        .status-badge { padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 0.75rem; text-transform: uppercase; display: inline-block; }
        .status-pending { background: #fef3c7; color: #b45309; }
        .status-active { background: #dcfce7; color: #15803d; }
        .status-closed { background: #f1f5f9; color: #475569; }
        
        .btn-delete { background: #be123c; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.8rem; }
        .btn-delete:hover { background: #9f1239; }
    </style>
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') { window.location.href = 'index.html'; }
        function handleLogout() { localStorage.removeItem('isLoggedIn'); window.location.href = 'index.html'; }
    </script>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div>
            <div class="sidebar-header">
                <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3" />
                </svg>
                <span>Advocate Desk</span>
            </div>
            <nav class="nav-links">
                <a href="dashboard.html">📊 Dashboard</a>
                <a href="diary.html" class="active">📅 Daily Case Diary</a>
                <a href="clients.html">👥 Client Database</a>
                <a href="billing.html">💳 Fee & Accounts</a>
            </nav>
        </div>
        <div style="padding: 15px; border-top: 1px solid #334155;">
            <button onclick="handleLogout()" class="btn-logout">🚪 Logout System</button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <header class="top-navbar">
            <h2 style="font-weight: 700;">📅 Daily Case Diary (Kabaat)</h2>
            <div style="font-size: 0.9rem; font-weight: 500; color: #64748b;">Active Mode</div>
        </header>

        <div class="content-box">
            <div class="form-card">
                <h3 style="margin-bottom: 15px; font-size: 1rem; color: #0f172a;">Add New Hearing Entry</h3>
                <form id="diaryForm" onsubmit="addDiaryEntry(event)" class="form-grid">
                    <div><input type="text" id="caseTitle" required placeholder="Case Title / Client Name" class="input-field"></div>
                    <div><input type="text" id="courtName" required placeholder="Court Name & Judge" class="input-field"></div>
                    <div><input type="date" id="hearingDate" required class="input-field"></div>
                    
                    <!-- New Dropdown Option to Choose Status -->
                    <div>
                        <select id="caseStatus" class="input-field">
                            <option value="pending">Pending</option>
                            <option value="active">Active</option>
                            <option value="closed">Closed</option>
                        </select>
                    </div>
                    
                    <div><button type="submit" class="btn-add">➕ Save Entry</button></div>
                </form>
            </div>

            <div class="table-card">
                <div class="table-title">Upcoming Hearings List</div>
                <table>
                    <thead>
                        <tr>
                            <th>Case Title</th>
                            <th>Court / Judge</th>
                            <th>Hearing Date</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="diaryTableBody">
                        <tr>
                            <td style="font-weight: 600;">Kamran Khan vs FESCO</td>
                            <td>High Court, Bench III</td>
                            <td style="color: #b45309; font-weight: 600;">2026-08-20</td>
                            <td><span class="status-badge status-pending">Pending</span></td>
                            <td><button class="btn-delete" onclick="deleteRow(this)">🗑️ Delete</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function addDiaryEntry(event) {
            event.preventDefault();
            
            const title = document.getElementById('caseTitle').value;
            const court = document.getElementById('courtName').value;
            const date = document.getElementById('hearingDate').value;
            const status = document.getElementById('caseStatus').value; // Dropdown value pick karna
            const tableBody = document.getElementById('diaryTableBody');

            // Set dynamic color classes based on user choice
            let badgeClass = "status-pending";
            if(status === "active") badgeClass = "status-active";
            if(status === "closed") badgeClass = "status-closed";

            const newRow = document.createElement('tr');
            newRow.innerHTML = `
                <td style="font-weight: 600;">${title}</td>
                <td>${court}</td>
                <td style="color: #b45309; font-weight: 600;">${date}</td>
                <td><span class="status-badge ${badgeClass}">${status}</span></td>
                <td><button class="btn-delete" onclick="deleteRow(this)">🗑️ Delete</button></td>
            `;

            tableBody.insertBefore(newRow, tableBody.firstChild);
            document.getElementById('diaryForm').reset();
        }

        function deleteRow(button) {
            if(confirm("Are you sure you want to delete this record?")) {
                const row = button.parentElement.parentElement;
                row.remove();
            }
        }
    </script>
</body>
</html>
