<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cause List - CMS Judiciary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <div class="brand-container">
            <div class="cms-logo">⚖️</div>
            <div class="brand-titles">
                <h1>ADVOCATE IFTHEKHAR AHMAD KHAN</h1>
                <p>Daily Cause List & Diary</p>
            </div>
        </div>
    </header>

    <main class="content-container">
        <div class="panel-card">
            <h2>Add New Hearing</h2>
            <form id="diary-form" onsubmit="saveDiary(event)">
                <div class="form-row">
                    <div class="form-field"><label>Date</label><input type="date" id="diary-date" required></div>
                    <div class="form-field"><label>Case Title</label><input type="text" id="diary-case" required></div>
                </div>
                <div class="form-row">
                    <div class="form-field"><label>Court</label><input type="text" id="diary-court" required></div>
                    <div class="form-field"><label>Stage</label><input type="text" id="diary-stage" required></div>
                </div>
                <button type="submit" class="cms-btn btn-navy">Save Entry</button>
            </form>
        </div>

        <div class="table-responsive">
            <table class="cms-table">
                <thead>
                    <tr><th>Date</th><th>Case Title</th><th>Court</th><th>Stage</th></tr>
                </thead>
                <tbody id="diary-records-body">
                    <tr><td>2026-08-25</td><td>Civil Suit #45/2026</td><td>INJRA Division</td><td>Arguments</td></tr>
                </tbody>
            </table>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
